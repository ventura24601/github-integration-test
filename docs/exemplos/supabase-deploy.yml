# Exemplo de workflow: copie para .github/workflows/supabase-deploy.yml
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar migrations
        run: supabase db push

      - name: Publicar Edge Functions
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions)" ]; then
            supabase functions deploy
          else
            echo "Nenhuma função para publicar."
          fi
