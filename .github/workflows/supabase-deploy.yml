# Aplica migrations e publica Edge Functions a cada push na main que mexa em supabase/.
# Requer os secrets SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF (veja docs/tutorial/07-tipos-e-ci.md).
# Sem eles, o job termina sem fazer nada em vez de falhar.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Opcional: sem a senha, a CLI usa uma role temporária obtida pelo access token.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verificar secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Secrets do Supabase não configurados; deploy ignorado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4

      - if: steps.check.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular projeto
        if: steps.check.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar migrations
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --yes

      - name: Publicar Edge Functions
        if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy --use-api
